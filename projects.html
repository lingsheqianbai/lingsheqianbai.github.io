                    }));
                    renderSimpleTable('jojoRewardsTable', rewardRows, [{ key: 'battle', label: '获取方式' }, { key: 'rewards', label: '可获报酬' }], 15, { searchKeys: ['battle', 'rewards'], placeholder: '搜索对战或报酬（如 第3部 / 设定图 / BGM）' });
                }
            }
            else if (game.id === 'onlyyou') {
                const endingsRes = await fetch('data/Only%20You/endings.json').catch(() => null);
                let endings = endingsRes && endingsRes.ok ? await endingsRes.json() : [];
                const html = `<details class="section-details"><summary>🎬 结局流程 (${endings.length}个)</summary><div class="section-content"><div id="onlyyouEndingsTableContainer"><table class="mod-table" id="onlyyouEndingsTable"><thead><tr><th>攻略名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="onlyyouEndingsTable-pagination"></div></div></div></details>`;
                detailDiv.innerHTML = html;
                const endingsData = endings.map(g => ({ name: g.name, url: g.url }));
                renderSimpleTable('onlyyouEndingsTable', endingsData, [{ key: 'name', label: '名称' }, { key: 'url', type: 'url', label: '链接' }], 15);
            }
            else if (game.id === 'room') {
                const [officialRes, prologueRes, pureLoveRes] = await Promise.all([
                    fetch('data/ROOM/official.json').catch(() => null),
                    fetch('data/ROOM/prologue.json').catch(() => null),
                    fetch('data/ROOM/pure_love.json').catch(() => null)
                ]);
                let roomOfficial = officialRes && officialRes.ok ? await officialRes.json() : [];
                let roomPrologue = prologueRes && prologueRes.ok ? await prologueRes.json() : [];
                let roomPureLove = pureLoveRes && pureLoveRes.ok ? await pureLoveRes.json() : [];

                let html = '';
                if (roomOfficial.length) {
                    html += `<details class="section-details"><summary>🔗 官方链接 (${roomOfficial.length}个)</summary><div class="section-content"><div id="roomOfficialTableContainer"><table class="mod-table" id="roomOfficialTable"><thead><tr><th>名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="roomOfficialTable-pagination"></div></div></div></details>`;
                }
                if (roomPrologue.length) {
                    html += `<details class="section-details"><summary>🎬 序章 (${roomPrologue.length}个)</summary><div class="section-content"><div style="font-size:12px;color:var(--text-mid);margin-bottom:10px;">💡 序章单独列出，不计入纯爱线条数</div><div id="roomPrologueTableContainer"><table class="mod-table" id="roomPrologueTable"><thead><tr><th>名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="roomPrologueTable-pagination"></div></div></div></details>`;
                }
                if (roomPureLove.length) {
                    html += `<details class="section-details"><summary>💗 纯爱线 (${roomPureLove.length}个)</summary><div class="section-content"><div id="roomPureLoveTableContainer"><table class="mod-table" id="roomPureLoveTable"><thead><tr><th>进度</th><th>链接</th></tr></thead><tbody></tbody></table><div id="roomPureLoveTable-pagination"></div></div></div></details>`;
                }
                detailDiv.innerHTML = html || '<div class="empty-tip">暂无内容，后续补充~</div>';

                if (roomOfficial.length) {
                    renderSimpleTable('roomOfficialTable', roomOfficial, [{ key: 'name', label: '名称' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
                if (roomPrologue.length) {
                    renderSimpleTable('roomPrologueTable', roomPrologue, [{ key: 'name', label: '名称' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
                if (roomPureLove.length) {
                    renderSimpleTable('roomPureLoveTable', roomPureLove, [{ key: 'name', label: '进度' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
            }
            else if (game.id === 'mhr') {
                const mhrRes = await fetch('data/MHR/tasks.json').catch(() => null);
                let mhrData = mhrRes && mhrRes.ok ? await mhrRes.json() : null;
                // 兼容两种结构：sections[]（多分区）或旧版 types[]（单分区）
                const mhrSections = (mhrData && mhrData.sections)
                    ? mhrData.sections
                    : ((mhrData && mhrData.types) ? [{ title: mhrData.sectionTitle || '任务类型：收集', hint: mhrData.hint, types: mhrData.types }] : []);

                const mhrStarCls = (n) => 's' + (n >= 1 && n <= 7 ? n : 7);
                // 锚点表：条目名 / 胶囊名 → 该行真正的 data-item 锚点
                // （称号系列不算，免得「回复药」这种称号名被当成道具）
                const mhrChipName = (c) => (c && typeof c === 'object') ? (c.name || '') : (c || '');
                const mhrChipHtml = (c) => {
                    const nm = mhrChipName(c);
                    const sub = (c && typeof c === 'object' && c.sub) ? `<em>${escapeHtml(c.sub)}</em>` : '';
                    return `<span class="mhr-chipitem">${escapeHtml(nm)}${sub}</span>`;
                };
                const mhrAnchor = new Map();
                mhrSections.forEach(sec => {
                    if (sec.id === 'title') return;
                    (sec.types || []).forEach(t => (t.items || []).forEach(it => {
                        const key = it.target || ((it.chips || []).map(mhrChipName).join('、')) || it.name;
                        if (!key) return;
                        mhrAnchor.set(key, key);
                        (it.chips || []).forEach(c => { const nm = mhrChipName(c); if (nm && !mhrAnchor.has(nm)) mhrAnchor.set(nm, key); });
                    }));
                });
                const mhrItem = (it) => {
                    const star = it.star ? `<span class="star ${mhrStarCls(it.star)}">★${it.star}</span>` : '';
                    const tags = (it.tags || []).map(tg => `<span class="mhr-tag">${escapeHtml(tg)}</span>`).join('');
                    const rtags = (it.rewardTypes || []).map(rt => `<span class="mhr-rtag">${escapeHtml(rt)}</span>`).join('');
                    // 解锁标签按语义分色：动画=蓝 称号=金 团子=粉 其他=灰蓝
                    const unlockCls = (text) => {
                        if (/^动画/.test(text)) return 'mhr-unlock mhr-unlock-anim';
                        if (/^称号/.test(text)) return 'mhr-unlock mhr-unlock-title';
                        if (/^团子/.test(text)) return 'mhr-unlock mhr-unlock-dango';
                        return 'mhr-unlock';
                    };
                    const unlocks = (it.unlocks || []).map(u => {
                        const text = (typeof u === 'string') ? u : u.text;
                        const jump = (typeof u === 'string') ? '' : (u.jump || '');
                        const cls = unlockCls(text) + (jump ? ' mhr-unlock-jump' : '');
                        return jump
                            ? `<button type="button" class="${cls}" data-jump="${escapeHtml(jump)}" title="跳到：${escapeHtml(jump)}">${escapeHtml(text)}</button>`
                            : `<span class="${cls}">${escapeHtml(text)}</span>`;
                    }).join('');
                    const noteBelow = !!it.noteBelow;
                    const isLong = it.note && (noteBelow || it.note.length > 16);
                    const isReward = !!(it.note && /^报酬[：:]/.test(it.note));
                    // 报酬标签：可多件，第一件带「报酬：」前缀；能在站内找到对应条目才可跳转
                    let pill = '';
                    if (isReward) {
                        const names = it.note.replace(/^报酬[：:]\s*/, '').split(/[、,，]/).map(s => s.trim()).filter(Boolean);
                        pill = names.map((nm, idx) => {
                            const label = (idx === 0 ? '报酬：' : '') + nm;
                            const anchor = mhrAnchor.get(nm);
                            return anchor
                                ? `<button type="button" class="mhr-reward mhr-reward-jump" data-jump="${escapeHtml(anchor)}" title="跳到：${escapeHtml(anchor)}">${escapeHtml(label)}</button>`
                                : `<span class="mhr-reward">${escapeHtml(label)}</span>`;
                        }).join('');
                    } else if (it.note && !isLong) {
                        pill = `<span class="mhr-badge">${escapeHtml(it.note)}</span>`;
                    }
                    const req = it.require ? `<span class="mhr-req">前置：${escapeHtml(it.require)}</span>` : '';
                    const jumpBtn = it.jumpTo ? `<button type="button" class="mhr-jump" data-jump="${escapeHtml(it.jumpTo)}" title="跳到：${escapeHtml(it.jumpTo)}">↗ ${escapeHtml(it.jumpTo)}</button>` : '';
                    // 名称区：可以是单个名称，也可以是一组胶囊（chips）
                    const names = Array.isArray(it.chips) && it.chips.length
                        ? it.chips.map(mhrChipHtml).join('')
                        : `<span class="mhr-name">${escapeHtml(it.name)}</span>`;
                    // 整行不可点；详情：有链接=蓝色可点，无链接=灰色占位（团子为 false 不显示）
                    const detail = it.url
                        ? `<a class="mhr-go" href="${it.url}" target="_blank" rel="noopener noreferrer">🔗 详情</a>`
                        : (it.detail === false ? '' : `<span class="mhr-go mhr-go-off">🔗 详情</span>`);
                    const rowHtml = `<div class="mhr-task">${star}${tags}${names}${req}${rtags}${unlocks}${pill}${jumpBtn}${detail}</div>`;
                    const noteLine = isLong ? `<div class="mhr-itemnote">备注：${escapeHtml(it.note)}</div>` : '';
                    // 搜索索引：名称 + 标签 + 报酬类型 + 前置 + 解锁内容 + 备注
                    const nameText = ((it.chips || []).join(' ') || it.name || '');
                    const searchText = (nameText + ' ' + (it.tags || []).join(' ') + ' ' + (it.rewardTypes || []).join(' ') + ' ' + (it.require || '') + ' ' + (it.unlocks || []).map(u => (typeof u === 'string' ? u : u.text)).join(' ') + ' ' + (it.note || '')).toLowerCase();
                    return `<div class="mhr-item" data-item="${escapeHtml(it.target || (it.chips || []).map(mhrChipName).join('、') || it.name || '')}" data-name="${escapeHtml(searchText)}" data-star="${it.star || ''}" data-rt="${escapeHtml((it.rewardTypes || []).join(' '))}">${rowHtml}${noteLine}</div>`;
                };

                const mhrTypeBody = (t) => {
                    const items = t.items || [];
                    const noteHtml = (t.note || t.desc) ? `<div class="mhr-typenote">${escapeHtml(t.note || t.desc)}</div>` : '';
                    if (!items.length) return noteHtml + '<div class="mhr-empty">该类型下暂无内容（等待录入）</div>';
                    // 称号/团子这类：一排小标签，不做星级折叠
                    if (t.layout === 'tags') {
                        const tags = items.map(it => {
                            const jb = it.jumpTo ? `<button type="button" class="mhr-jump" data-jump="${escapeHtml(it.jumpTo)}">↗ ${escapeHtml(it.jumpTo)}</button>` : '';
                            return `<span class="mhr-item mhr-ttag" data-item="${escapeHtml(it.name || '')}" data-name="${escapeHtml(((it.name || '') + ' ' + (it.sub || '')).toLowerCase())}" data-star="" data-rt="">${escapeHtml(it.name)}${it.sub ? `<em>${escapeHtml(it.sub)}</em>` : ''}${jb}</span>`;
                        }).join('');
                        return noteHtml + `<div class="mhr-tags">${tags}</div>`;
                    }
                    if (!items.some(it => it.star)) return noteHtml + items.map(mhrItem).join('');
                    const groups = {};
                    items.forEach(it => { const k = it.star || 0; (groups[k] = groups[k] || []).push(it); });
                    return noteHtml + Object.keys(groups).map(Number).sort((a, b) => a - b).map(k => {
                        const rows = groups[k].map(mhrItem).join('');
                        const head = k ? `<span class="star ${mhrStarCls(k)}">★${k}</span>` : '<span class="mhr-badge" style="background:var(--text-light);">未标星级</span>';
                        return `<div class="mhr-star-group" data-star="${k}"><div class="mhr-star-head">${head}<span class="mhr-star-n">${groups[k].length} 条</span><span class="mhr-chev">▼</span></div><div class="mhr-star-body">${rows}</div></div>`;
                    }).join('');
                };

                const mhrCards = (types) => types.map((t, i) => {
                    const items = t.items || [];
                    // 「项」= 胶囊个数；没有胶囊时算 1 项
                    const size = items.reduce((a, it) => a + ((Array.isArray(it.chips) && it.chips.length) ? it.chips.length : 1), 0);
                    const stars = items.map(it => it.star).filter(Boolean);
                    const range = stars.length ? (Math.min(...stars) === Math.max(...stars) ? ('★' + stars[0]) : ('★' + Math.min(...stars) + '–★' + Math.max(...stars))) : '';
                    const meta = range ? (range + ' · ' + size) : (size || '—');
                    const jumpBtn = t.jumpTo ? `<button type="button" class="mhr-jump" data-jump="${escapeHtml(t.jumpTo)}" title="跳到：${escapeHtml(t.jumpTo)}">↗ ${escapeHtml(t.jumpTo)}</button>` : '';
                    return `<div class="mhr-type" data-i="${i}" data-typename="${escapeHtml(t.name || '')}" data-name="${escapeHtml((t.name || '').toLowerCase())}"><div class="mhr-type-head"><span>${escapeHtml(t.name)}</span>${jumpBtn}<span class="mhr-n">${meta}</span><span class="mhr-chev">▼</span></div><div class="mhr-type-body">${mhrTypeBody(t)}</div></div>`;
                }).join('');

                let html = '';
                const mhrSecCards = mhrSections.map((sec, si) => {
                    const types = sec.types || [];
                    const total = types.reduce((s, t) => s + (t.items || []).reduce((a, it) => a + ((Array.isArray(it.chips) && it.chips.length) ? it.chips.length : 1), 0), 0);
                    const secName = sec.name || sec.title || '收集';
                    const secIcon = sec.icon || '📁';
                    const secDesc = sec.desc || '';
                    const ph = sec.searchPlaceholder || '搜索本类内容（名称 / 报酬 / 星级，如 回复药、称号、★2、手记 3）';
                    // 报酬类型筛选（数据里标了 rewardTypes 才有）
                    const rtCount = {};
                    types.forEach(t => (t.items || []).forEach(it => (it.rewardTypes || []).forEach(rt => { rtCount[rt] = (rtCount[rt] || 0) + 1; })));
                    const rtList = Object.keys(rtCount).sort((a, b) => rtCount[b] - rtCount[a]);
                    const chips = rtList.length
                        ? `<div class="mhr-chips" data-rt=""><button type="button" class="mhr-chip active" data-rt="">全部<span class="n">${total}</span></button>${rtList.map(rt => `<button type="button" class="mhr-chip" data-rt="${escapeHtml(rt)}">${escapeHtml(rt)}<span class="n">${rtCount[rt]}</span></button>`).join('')}</div>`
                        : '';
                    return `<div class="mhr-sec" data-si="${si}"><div class="mhr-sec-head"><div class="mhr-sec-icon">${secIcon}</div><div class="mhr-sec-title">${escapeHtml(secName)}<span class="mhr-sec-count">${types.length}种 · ${total}个</span><span class="mhr-sec-chev">▼</span></div>${secDesc ? `<div class="mhr-sec-desc">${escapeHtml(secDesc)}</div>` : ''}</div><div class="mhr-sec-body"><div class="mhr-search"><input type="text" class="mhr-search-input" placeholder="${escapeHtml(ph)}"><span class="mhr-search-count"></span></div>${chips}<div class="mhr-noresult">没有匹配的内容</div><div class="mhr-grid" id="mhrGrid${si}">${mhrCards(types)}</div></div></div>`;
                }).join('');
                if (mhrSecCards) html = `<div class="mhr-sections">${mhrSecCards}</div>`;
                detailDiv.innerHTML = html || '<div class="empty-tip">暂无内容，后续补充~</div>';

                const mhrSecWrap = document.querySelector('.mhr-sections');
                // 卡片间跳转：展开目标所在的分区/卡片/星级组，滚动过去并闪烁
                // （提到这里是因为顶部全站搜索也要用）
                const mhrJumpTo = (name) => {
                    const list = [...document.querySelectorAll('.mhr-sections [data-item]')];
                    let target = list.find(el => el.dataset.item === name);
                    if (!target) {
                        // 也支持跳到某张卡片（如称号系列的三星卡）
                        target = [...document.querySelectorAll('.mhr-sections [data-typename]')].find(el => el.dataset.typename === name);
                    }
                    if (!target) { alert('没有找到：' + name); return; }
                    const sec = target.closest('.mhr-sec'); if (sec) sec.classList.add('open');
                    const type = target.closest('.mhr-type'); if (type) type.classList.add('open');
                    const grp = target.closest('.mhr-star-group'); if (grp) grp.classList.add('open');
                    setTimeout(() => {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
                        setTimeout(() => target.classList.remove('flash'), 3000);
                    }, 60);
                };

                if (mhrSecWrap && !mhrSecWrap.__mhrBound) {
                    mhrSecWrap.__mhrBound = true;

                    // 点击：跳转按钮 > 星级头 > 卡片头 > 分区头
                    mhrSecWrap.addEventListener('click', (e) => {
                        const jump = e.target.closest('[data-jump]');
                        if (jump) { e.preventDefault(); e.stopPropagation(); mhrJumpTo(jump.dataset.jump); return; }
                        const starHead = e.target.closest('.mhr-star-head');
                        if (starHead) { starHead.parentElement.classList.toggle('open'); return; }
                        const typeHead = e.target.closest('.mhr-type-head');
                        if (typeHead) { typeHead.parentElement.classList.toggle('open'); return; }
                        const secHead = e.target.closest('.mhr-sec-head');
                        if (secHead) { secHead.parentElement.classList.toggle('open'); return; }
                    });

                    // 搜索 + 报酬类型筛选：共用一套过滤
                    const mhrApplyFilter = (body) => {
                        const inp = body.querySelector('.mhr-search-input');
                        const q = inp ? inp.value.trim().toLowerCase() : '';
                        const chipsBox = body.querySelector('.mhr-chips');
                        const rt = chipsBox ? (chipsBox.dataset.rt || '') : '';
                        const on = !!(q || rt);
                        let total = 0;
                        body.querySelectorAll('.mhr-type').forEach(tc => {
                            const typeName = tc.dataset.name || '';
                            const typeHit = q && !rt && typeName.indexOf(q) > -1;
                            let hit = 0;
                            tc.querySelectorAll('.mhr-item').forEach(a => {
                                const name = a.dataset.name || '';
                                const star = a.dataset.star || '';
                                const rts = a.dataset.rt || '';
                                const okQ = !q || typeHit || name.indexOf(q) > -1 || (star && (q === star || q === '★' + star));
                                const okR = !rt || rts.split(' ').indexOf(rt) > -1;
                                const ok = okQ && okR;
                                a.style.display = ok ? '' : 'none';
                                if (ok) hit++;
                            });
                            total += hit;
                            tc.style.display = (!on || hit > 0) ? '' : 'none';
                            if (on && hit > 0) tc.classList.add('open');
                            tc.querySelectorAll('.mhr-star-group').forEach(g => {
                                const vis = [...g.querySelectorAll('.mhr-item')].filter(a => a.style.display !== 'none').length;
                                g.style.display = (vis > 0 || !on) ? '' : 'none';
                                if (on && vis > 0) g.classList.add('open');
                            });
                        });
                        const nores = body.querySelector('.mhr-noresult');
                        if (nores) nores.style.display = (on && total === 0) ? 'block' : 'none';
                        const cnt = body.querySelector('.mhr-search-count');
                        if (cnt) cnt.textContent = on ? ((rt ? '[' + rt + '] ' : '') + '找到 ' + total + ' 条') : '';
                    };

                    mhrSecWrap.addEventListener('input', (e) => {
                        const inp = e.target.closest('.mhr-search-input');
                        if (inp) mhrApplyFilter(inp.closest('.mhr-sec-body'));
                    });

                    mhrSecWrap.addEventListener('click', (e) => {
                        const chip = e.target.closest('.mhr-chip');
                        if (!chip) return;
                        const box = chip.closest('.mhr-chips');
                        box.querySelectorAll('.mhr-chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        box.dataset.rt = chip.dataset.rt || '';
                        mhrApplyFilter(chip.closest('.mhr-sec-body'));
                    });
                }

                // ===== 顶部「全站搜索」：跨分区，且带关系扩展 =====
                const mhrToolbar = document.getElementById('detailToolbar');
                if (mhrToolbar) {
                    const chipName = (c) => (c && typeof c === 'object') ? (c.name || '') : (c || '');
                    const idx = [];
                    mhrSections.forEach(sec => (sec.types || []).forEach(t => (t.items || []).forEach(it => {
                        const chips = (it.chips || []).map(chipName);
                        const key = it.target || (chips.length ? chips.join('、') : (it.name || ''));
                        if (!key) return;
                        idx.push({
                            key,
                            label: chips.length ? chips.join(' / ') : (it.name || ''),
                            sec: sec.name || sec.title || '',
                            type: t.name || '',
                            links: [it.jumpTo || ''].concat((it.unlocks || []).map(u => (typeof u === 'string' ? '' : (u.jump || '')))).filter(Boolean)
                        });
                    })));

                    mhrToolbar.innerHTML = `<div class="mhr-global"><input type="text" id="mhrGlobalInput" placeholder="搜索全部内容：任务 / 称号 / 团子 / 动画 / 道具…"><div class="mhr-global-results" id="mhrGlobalResults"></div></div>`;
                    const gin = document.getElementById('mhrGlobalInput');
                    const gbox = document.getElementById('mhrGlobalResults');

                    const renderGlobal = () => {
                        const q = gin.value.trim().toLowerCase();
                        if (!q) { gbox.classList.remove('on'); gbox.innerHTML = ''; return; }
                        let hits = idx.filter(x => (x.label + ' ' + x.key).toLowerCase().indexOf(q) > -1);
                        const keys = new Set(hits.map(h => h.key));
                        // 关系扩展：跳到命中项的行 / 解锁到命中项的行，也一起列出
                        idx.forEach(x => { if (hits.indexOf(x) < 0 && x.links.some(l => keys.has(l))) hits.push(x); });
                        hits = hits.slice(0, 40);
                        if (!hits.length) { gbox.innerHTML = '<div class="mgr-empty">没有匹配的内容</div>'; gbox.classList.add('on'); return; }
                        gbox.innerHTML = '<div class="mgr-head">找到 ' + hits.length + ' 项（含关联条目）</div>' +
                            hits.map(x => `<button type="button" class="mgr-item" data-key="${escapeHtml(x.key)}"><span>${escapeHtml(x.label)}</span><span class="mgr-where">${escapeHtml(x.sec.replace('系列：收集', ''))} › ${escapeHtml(x.type)}</span></button>`).join('');
                        gbox.classList.add('on');
                    };

                    gin.addEventListener('input', renderGlobal);
                    gin.addEventListener('focus', renderGlobal);
                    gbox.addEventListener('click', (e) => {
                        const b = e.target.closest('.mgr-item');
                        if (!b) return;
                        mhrJumpTo(b.dataset.key);
                        gbox.classList.remove('on');
                    });
                    if (!window.__mhrGlobalBound) {
                        window.__mhrGlobalBound = true;
                        document.addEventListener('click', (e) => {
                            const box2 = document.getElementById('mhrGlobalResults');
                            if (box2 && !e.target.closest('.mhr-global')) box2.classList.remove('on');
                        });
                    }
                }
            }
            else if (game.id === 'sonsoftheforest') {
                const [modsRes, tutorialsRes, collectiblesRes, recommendationsRes, resourcesRes, modWebsitesRes] = await Promise.all([
                    fetch('data/Sons%20of%20the%20Forest/mods.json').catch(() => null),
                    fetch('data/Sons%20of%20the%20Forest/tutorials.json').catch(() => null),
                    fetch('data/Sons%20of%20the%20Forest/collectibles.json').catch(() => null),
                    fetch('data/Sons%20of%20the%20Forest/recommendations.json').catch(() => null),
                    fetch('data/Sons%20of%20the%20Forest/resources.json').catch(() => null),
                    fetch('data/Sons%20of%20the%20Forest/mod_websites.json').catch(() => null)
                ]);
                let mods = modsRes && modsRes.ok ? await modsRes.json() : [];
                let tutorials = tutorialsRes && tutorialsRes.ok ? await tutorialsRes.json() : [];
                let collectibles = collectiblesRes && collectiblesRes.ok ? await collectiblesRes.json() : [];
                let recommendations = recommendationsRes && recommendationsRes.ok ? await recommendationsRes.json() : [];
                let resources = resourcesRes && resourcesRes.ok ? await resourcesRes.json() : [];
                let modWebsites = modWebsitesRes && modWebsitesRes.ok ? await modWebsitesRes.json() : [];

                let html = '';
                if (mods.length) {
                    html += `<details class="section-details"><summary>📦 森林之子模组 (${mods.length}个)</summary><div class="section-content"><div id="sotfModsTableContainer"><table class="mod-table" id="sotfModsTable"><thead><tr><th>模组名称</th><th>模组中文名</th><th>备注</th></tr></thead><tbody></tbody></table><div id="sotfModsTable-pagination"></div></div></div></details>`;
                }
                if (tutorials.length) {
                    html += `<details class="section-details"><summary>📖 森林之子教程 (${tutorials.length}个)</summary><div class="section-content"><div id="sotfTutorialsTableContainer"><table class="mod-table" id="sotfTutorialsTable"><thead><tr><th>教程名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="sotfTutorialsTable-pagination"></div></div></div></details>`;
                }
                if (collectibles.length) {
                    const sotfNoteCount = collectibles.filter(x => x && x.name && x.name.indexOf('说明') === 0).length;
                    const sotfTotal = collectibles.length - sotfNoteCount;
                    html += `<details class="section-details"><summary>🎬 森林之子全收集 (${sotfTotal}个)</summary><div class="section-content"><div id="sotfCollectiblesTableContainer"><table class="mod-table" id="sotfCollectiblesTable"><thead><tr><th>名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="sotfCollectiblesTable-pagination"></div></div></div></details>`;
                }
                if (recommendations.length) {
                    const sotfRecTotal = recommendations.filter(x => !(x && x.name && x.name.indexOf('说明') === 0)).length;
                    html += `<details class="section-details"><summary>⭐ 森林之子模组推荐 (${sotfRecTotal}个)</summary><div class="section-content"><div id="sotfRecommendationsTableContainer"><table class="mod-table" id="sotfRecommendationsTable"><thead><tr><th>名称</th><th>链接 / 密码</th></tr></thead><tbody></tbody></table><div id="sotfRecommendationsTable-pagination"></div></div></div></details>`;
                }
                if (resources.length) {
                    const sotfResTotal = resources.filter(x => !(x && x.name && x.name.indexOf('说明') === 0)).length;
                    html += `<details class="section-details"><summary>📖 森林之子资源下载 (${sotfResTotal}个)</summary><div class="section-content"><div id="sotfResourcesTableContainer"><table class="mod-table" id="sotfResourcesTable"><thead><tr><th>名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="sotfResourcesTable-pagination"></div></div></div></details>`;
                }
                if (modWebsites.length) {
                    const sotfWebTotal = modWebsites.filter(x => !(x && x.name && x.name.indexOf('说明') === 0)).length;
                    html += `<details class="section-details"><summary>🌐 森林之子模组网页推荐 (${sotfWebTotal}个)</summary><div class="section-content"><div id="sotfModWebsitesTableContainer"><table class="mod-table" id="sotfModWebsitesTable"><thead><tr><th>网站</th><th>链接</th></tr></thead><tbody></tbody></table><div id="sotfModWebsitesTable-pagination"></div></div></div></details>`;
                }
                detailDiv.innerHTML = html || '<div class="empty-tip">暂无内容，后续补充~</div>';

                if (mods.length) {
                    renderSimpleTable('sotfModsTable', mods, [{ key: 'name', label: '模组名称' }, { key: 'chineseName', label: '模组中文名' }, { key: 'note', label: '备注' }], 15);
                }
                if (tutorials.length) {
                    renderSimpleTable('sotfTutorialsTable', tutorials, [{ key: 'name', label: '教程名称' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
                if (collectibles.length) {
                    renderSimpleTable('sotfCollectiblesTable', collectibles, [{ key: 'name', label: '名称' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
                if (recommendations.length) {
                    renderSimpleTable('sotfRecommendationsTable', recommendations, [{ key: 'name', label: '名称' }, { key: 'url', type: 'url', label: '链接 / 密码' }], 15);
                }
                if (resources.length) {
                    renderSimpleTable('sotfResourcesTable', resources, [{ key: 'name', label: '名称' }, { key: 'url', type: 'sources', label: '下载' }], 15);
                    window._sotfSourcePick = function (official, alt, pwd) {
                        const old = document.getElementById('sotfSrcPicker');
                        if (old) old.remove();
                        let html = '<div id="sotfSrcPickerBackdrop" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10000;display:flex;align-items:center;justify-content:center;">'
                            + '<div style="background:#fff;border:1px solid #000;border-radius:16px;padding:22px;max-width:340px;width:88%;box-shadow:0 10px 30px rgba(0,0,0,.3);">'
                            + '<div style="font-size:15px;font-weight:bold;margin-bottom:4px;">📥 选择下载方式</div>'
                            + '<div style="font-size:12px;color:#5a3e4b;margin-bottom:14px;">同一个文件，两个来源，点哪个都能下</div>';
                        if (official) html += '<a class="sotfSrcBtn" href="' + official + '" target="_blank" rel="noopener" style="display:block;text-align:center;background:#ffcfe2;border:1px solid #000;border-radius:12px;padding:11px 14px;margin-bottom:10px;text-decoration:none;color:#2a1a2e;font-weight:bold;">🔗 官方链接下载</a>';
                        if (alt) html += '<a class="sotfSrcBtn" href="' + alt + '" target="_blank" rel="noopener" style="display:block;text-align:center;background:#ffcfe2;border:1px solid #000;border-radius:12px;padding:11px 14px;margin-bottom:10px;text-decoration:none;color:#2a1a2e;font-weight:bold;">📦 UP链接下载</a>';
                        if (pwd) html += '<div style="font-size:12px;color:#5a3e4b;text-align:center;margin-top:2px;">网盘提取码：<b>' + pwd + '</b></div>';
                        html += '<div id="sotfSrcClose" style="text-align:center;margin-top:14px;font-size:12px;color:#8a6f7b;cursor:pointer;text-decoration:underline;">取消</div></div></div>';
                        const wrap = document.createElement('div');
                        wrap.innerHTML = html;
                        const backdrop = wrap.firstElementChild;
                        document.body.appendChild(backdrop);
                        backdrop.addEventListener('click', (e) => { if (e.target === backdrop || e.target.id === 'sotfSrcClose') backdrop.remove(); });
                        backdrop.querySelectorAll('.sotfSrcBtn').forEach(function (b) { b.addEventListener('click', function () { setTimeout(function () { backdrop.remove(); }, 250); }); });
                    };
                    const resContainer = document.getElementById('sotfResourcesTableContainer');
                    if (resContainer && !resContainer.__srcBound) {
                        resContainer.__srcBound = true;
                        resContainer.addEventListener('click', function (e) {
                            const b = e.target.closest('.sources-pick');
                            if (b) window._sotfSourcePick(b.dataset.o || '', b.dataset.a || '', b.dataset.p || '');
                        });
                    }
                }
                if (modWebsites.length) {
                    renderSimpleTable('sotfModWebsitesTable', modWebsites, [{ key: 'name', label: '网站' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
            }
            else if (game.id === '7days') {
                const [endingsRes, cgRes] = await Promise.all([
                    fetch('data/7%20Days/endings.json').catch(() => null),
                    fetch('data/7%20Days/cg.json').catch(() => null)
                ]);
                let endings = endingsRes && endingsRes.ok ? await endingsRes.json() : [];
                let cg = cgRes && cgRes.ok ? await cgRes.json() : [];

                let html = '';
                if (endings.length) {
                    html += `<details class="section-details"><summary>🎬 结局流程 (${endings.length}个)</summary><div class="section-content"><div id="sevendaysEndingsTableContainer"><table class="mod-table" id="sevendaysEndingsTable"><thead><tr><th>攻略名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="sevendaysEndingsTable-pagination"></div></div></div></details>`;
                }
                if (cg.length) {
                    html += `<details class="section-details"><summary>🖼️ 官方CG包 (${cg.length}个)</summary><div class="section-content"><div id="sevendaysCgTableContainer"><table class="mod-table" id="sevendaysCgTable"><thead><tr><th>名称</th><th>链接</th></tr></thead><tbody></tbody></table><div id="sevendaysCgTable-pagination"></div></div></div></details>`;
                }
                detailDiv.innerHTML = html || '<div class="empty-tip">暂无内容</div>';

                if (endings.length) {
                    const endingsData = endings.map(g => ({ name: g.name, url: g.url }));
                    renderSimpleTable('sevendaysEndingsTable', endingsData, [{ key: 'name', label: '名称' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
                if (cg.length) {
                    const cgData = cg.map(g => ({ name: g.name, url: g.url }));
                    renderSimpleTable('sevendaysCgTable', cgData, [{ key: 'name', label: '名称' }, { key: 'url', type: 'url', label: '链接' }], 15);
                }
            }
            else {
                detailDiv.innerHTML = '<div class="empty-tip">暂无内容，后续补充~</div>';
            }
        }

        // ---------- 游戏卡片列表 ----------
        let gamesData = [];
        let currentFilter = '';

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            try {
                const res = await fetch('data/games.json');
                if (!res.ok) throw new Error();
                gamesData = await res.json();
                renderGameCards();
            } catch (err) {
                grid.innerHTML = '<div style="text-align:center; padding:20px;">加载失败，请检查 data/games.json</div>';
            }
        }

        function renderGameCards() {
            const grid = document.getElementById('gamesGrid');
            const filtered = gamesData.filter(g => 
                currentFilter === '' || g.name.includes(currentFilter)
            );
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="text-align:center; padding:20px;">没有找到相关游戏</div>';
                return;
            }
            grid.innerHTML = filtered.map(g => `
                <div class="project-card" data-id="${g.id}">
                    <div class="project-icon">${g.icon || '🎮'}</div>
                    <div class="project-title">${escapeHtml(g.name)}</div>
                    <div class="project-desc">${escapeHtml(g.description)}</div>
                </div>
            `).join('');

            document.querySelectorAll('.project-card').forEach(card => {
                card.addEventListener('click', async () => {
                    const id = card.dataset.id;
                    const game = gamesData.find(g => g.id === id);
                    if (game) {
                        document.getElementById('gamesGridView').style.display = 'none';
                        document.getElementById('gameDetailView').style.display = 'block';
                        await loadGameDetail(game);
                    }
                });
            });
        }

        function backToGrid() {
            document.getElementById('gamesGridView').style.display = 'block';
            document.getElementById('gameDetailView').style.display = 'none';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentFilter = e.target.value;
            renderGameCards();
        });
        document.getElementById('backToGridBtn').addEventListener('click', backToGrid);

        loadGames();
    </script>
