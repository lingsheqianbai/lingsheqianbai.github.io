<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目 - 千白分享</title>
    <style>
        /* ========== 基础风格（保持不变） ========== */
        :root {
            --sidebar-width: 260px;
            --nav-offset: 60px;
            --border-color: #000;
            --bg-card: #fff;
            --bg-sidebar: #fff;
            --text-dark: #2a1a2e;
            --text-mid: #5a3e4b;
            --text-light: #bba3ad;
            --shadow: 4px 4px 0 rgba(0,0,0,0.1);
            --pink: #f9bddd;
            --pink-dark: #c44569;
            --pink-light: #ffcfe2;
        }

        @font-face {
            font-family: 'ZQKNNY';
            src: url('ZQKNNY-Medium-2.woff2') format('woff2');
            font-weight: 500; font-style: normal; font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei UI", "Microsoft YaHei", "SimHei", "黑体", "SimSun", "ZQKNNY", sans-serif;
            background: url('images/beijin1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding-top: var(--nav-offset);
            color: var(--text-dark);
        }

        nav {
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 999;
            background: #fff;
            border-bottom: 2px solid #000;
        }
        nav .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            list-style: none;
            padding: 8px 16px;
            margin: 0;
            gap: 12px;
        }
        nav .links li a {
            display: inline-block;
            padding: 8px 32px;
            border-radius: 32px;
            border: 1px solid #000;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
            transition: filter 0.2s;
            cursor: pointer;
        }
        nav .links li a:hover { filter: brightness(0.85); }

        .left-col {
            position: fixed;
            left: 20px;
            top: var(--nav-offset);
            width: var(--sidebar-width);
            z-index: 950;
        }
        .profile-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .profile-avatar {
            text-align: center;
            margin-bottom: 8px;
        }
        .profile-avatar img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }
        .profile-name { font-size: 18px; font-weight: bold; text-align: center; }
        .profile-signature { font-size: 11px; text-align: center; color: var(--text-mid); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-color); }

        .player {
            margin: 16px 0 12px;
            text-align: center;
        }
        .vinyl {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 35%, #222, #111);
            border-radius: 50%;
            box-shadow: 0 0 0 4px #444, 0 0 0 6px #888;
        }
        .vinyl.playing {
            animation: spin 5s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .vinyl-center-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.9);
            object-fit: cover;
            background: #fff;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .player-controls button {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .player-controls button:hover { background: var(--pink); }
        .song-title {
            font-size: 10px;
            color: var(--text-mid);
            text-align: center;
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: inline-block;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-info {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }
        .contact-info p { margin: 6px 0; }
        .contact-info a { color: var(--pink-dark); text-decoration: none; }
        .contact-info a:hover { text-decoration: underline; }

        .right-col {
            margin-left: calc(var(--sidebar-width) + 40px);
            margin-right: 20px;
            max-width: 1200px;
        }
        .page-header {
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h2 {
            font-size: 24px;
            display: inline-block;
            background: var(--pink-light);
            padding: 4px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .search-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-bar input {
            border: none;
            background: none;
            outline: none;
            font-size: 13px;
            width: 180px;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .project-icon { font-size: 36px; margin-bottom: 12px; }
        .project-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .project-desc { font-size: 13px; color: var(--text-mid); line-height: 1.5; }

        .detail-view {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        .back-btn {
            background: var(--pink-light);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-btn:hover { background: var(--pink); }
        .detail-topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .detail-topbar .back-btn { margin-bottom: 0; }
        /* 全站搜索（详情页顶部） */
        .mhr-global { position: relative; flex: 1; min-width: 240px; max-width: 460px; }
        .mhr-global input {
            width: 100%; padding: 7px 14px; font-family: inherit; font-size: 13px;
            border: 1px solid var(--border-color); border-radius: 24px; background: #fff;
        }
        .mhr-global input:focus { outline: none; border-color: var(--pink-dark); box-shadow: 0 0 0 2px var(--pink-light); }
        .mhr-global-results {
            display: none; position: absolute; z-index: 30; left: 0; right: 0; top: 110%;
            max-height: 340px; overflow-y: auto; background: #fff;
            border: 1px solid var(--border-color); border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 6px;
        }
        .mhr-global-results.on { display: block; }
        .mgr-head { font-size: 11px; color: var(--text-light); padding: 6px 8px 4px; }
        .mgr-item {
            display: flex; align-items: center; gap: 8px; width: 100%;
            text-align: left; font-family: inherit; font-size: 12px; color: var(--text-dark);
            background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer;
        }
        .mgr-item:hover { background: var(--pink-light); }
        .mgr-where { font-size: 11px; color: var(--text-light); margin-left: auto; white-space: nowrap; }
        .mgr-empty { font-size: 12px; color: var(--text-mid); padding: 10px; }

        .section-details {
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .section-details summary {
            background: var(--pink-light);
            padding: 12px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }
        .section-details summary::-webkit-details-marker { display: none; }
        .section-details summary::after {
            content: '▼';
            margin-left: auto;
            transition: transform 0.2s;
        }
        .section-details[open] summary::after {
            transform: rotate(180deg);
        }
        .section-content {
            padding: 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
        }

        /* 模组统计样式 */
        .stats-bar {
            margin-bottom: 16px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            font-size: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        .stats-item { display: flex; align-items: center; gap: 4px; }
        .stats-number { font-weight: 600; }
        .stats-complete { color: #2ecc71; }
        .stats-incomplete { color: #f1c40f; }
        .stats-pending { color: #3498db; }
        .stats-unneeded { color: #9b59b6; }
        .stats-todo { color: #ff8c00; }

        .search-box { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .search-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: #fff;
            font-size: 13px;
        }
        .filter-section {
            margin-bottom: 20px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.03);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .filter-header {
            padding: 12px 16px;
            background: var(--pink-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
        }
        .filter-header .arrow { transition: transform .3s; }
        .filter-header.collapsed .arrow { transform: rotate(-90deg); }
        .filter-content {
            padding: 16px;
            transition: max-height .3s ease;
            max-height: 800px;
            overflow: hidden;
        }
        .filter-content.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
        }
        .filter-group {
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 12px;
        }
        .filter-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .filter-group-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
        }
        .filter-group-header .group-arrow { transition: transform .2s; font-size: 12px; }
        .filter-group-header.collapsed .group-arrow { transform: rotate(-90deg); }
        .filter-group-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            transition: max-height .2s ease;
            max-height: 200px;
            overflow: hidden;
        }
        .filter-group-options.collapsed {
            max-height: 0;
            opacity: 0;
        }
        .filter-btn {
            padding: 4px 12px;
            border-radius: 30px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            color: #333;
            font-size: 12px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: var(--pink);
            border-color: var(--border-color);
            color: #fff;
        }
        .mod-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        .mod-table th, .mod-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        .mod-table th {
            background: var(--pink-light);
            font-weight: bold;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 11px;
            background: #eee;
        }
        .status-complete { background: #c8e6c9; color: #2e7d32; }
        .status-incomplete { background: #ffecb3; color: #b26a00; }
        .status-pending { background: #ffcdd2; color: #c62828; }
        .status-unneeded { background: #e1bee7; color: #6a1b9a; }
        .status-todo { background: #ffe0b2; color: #bf360c; }

        .mod-id { font-size: 11px; color: #666; display: block; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .pagination button, .pagination .page-number, .pagination .page-dots {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .pagination button:hover, .pagination .page-number:hover, .pagination .page-dots:hover {
            background: var(--pink-light);
        }
        .pagination .page-number.active {
            background: var(--pink);
            color: #fff;
            border-color: var(--pink-dark);
        }
        .pagination .page-dots { cursor: pointer; }
        .empty-tip {
            text-align: center;
            padding: 30px;
            color: var(--text-mid);
        }

        @media (max-width: 800px) {
            .left-col { display: none; }
            .right-col { margin-left: 20px; }
            .mod-table th, .mod-table td { font-size: 11px; padding: 4px; }
        }
        @media (max-width: 768px) {
            nav .links li a { padding: 6px 20px; font-size: 12px; }
        }

        /* ========== 任务类型卡片（怪物猎人） ========== */
        .mhr-tip {
            font-size: 12px; color: var(--text-mid);
            background: rgba(0,0,0,0.04); border-left: 3px solid var(--pink);
            border-radius: 6px; padding: 8px 12px; margin-bottom: 14px;
        }
        .mhr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        }
        .mhr-type {
            background: #fff; border: 1px solid var(--border-color); border-radius: 12px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.08); cursor: pointer;
            transition: transform .15s, box-shadow .15s;
        }
        .mhr-type:hover { transform: translateY(-2px); box-shadow: 3px 4px 0 rgba(0,0,0,0.12); }
        .mhr-type-head {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 14px; font-size: 14px; font-weight: bold;
        }
        .mhr-n { font-size: 11px; font-weight: normal; color: var(--text-mid); margin-left: auto; background: #f6ecf0; border: 1px solid #eadde3; border-radius: 20px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .mhr-chev { font-size: 10px; color: var(--text-mid); transition: transform .2s; }
        .mhr-type.open { grid-column: 1 / -1; box-shadow: 4px 4px 0 rgba(0,0,0,0.12); }
        .mhr-type.open .mhr-type-head {
            background: var(--pink-light);
            border-bottom: 1px solid var(--border-color);
            border-radius: 12px 12px 0 0;
        }
        .mhr-type.open .mhr-chev { transform: rotate(180deg); }
        .mhr-type-body { display: none; padding: 12px 14px; }
        .mhr-type.open .mhr-type-body { display: block; }
        .mhr-task {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px; border: 1px solid #e5d9de; border-radius: 10px;
            margin-bottom: 8px; font-size: 13px; text-decoration: none; color: var(--text-dark);
            transition: background .15s;
        }
        .mhr-task:last-child { margin-bottom: 0; }
        .mhr-task { cursor: default; }
        .mhr-go { margin-left: auto; color: #3B82F6; font-size: 12px; }
        .mhr-badge {
            font-size: 11px; color: #fff; background: var(--pink-dark);
            border-radius: 20px; padding: 1px 8px; white-space: nowrap;
        }
        /* 第一层：项目卡片样式 */
        .mhr-sections {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }
        .mhr-sec {
            background: #fff; border: 1px solid var(--border-color); border-radius: 16px;
            box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
            transition: transform .2s, box-shadow .2s;
        }
        .mhr-sec:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .mhr-sec-head { padding: 20px; }
        .mhr-sec-icon { font-size: 44px; margin-bottom: 10px; }
        .mhr-sec-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .mhr-sec-count { font-size: 11px; font-weight: normal; color: #fff; background: var(--pink-dark); border-radius: 20px; padding: 1px 8px; }
        .mhr-sec-chev { margin-left: auto; font-size: 11px; color: var(--text-mid); transition: transform .2s; }
        .mhr-sec-desc { font-size: 13px; color: var(--text-mid); line-height: 1.5; margin-top: 6px; }
        .mhr-sec.open { grid-column: 1 / -1; cursor: default; transform: none; }
        .mhr-sec.open:hover { transform: none; box-shadow: var(--shadow); }
        .mhr-sec.open .mhr-sec-head { background: var(--pink-light); border-bottom: 1px solid var(--border-color); }
        .mhr-sec.open .mhr-sec-chev { transform: rotate(180deg); }
        .mhr-sec-body { display: none; padding: 16px; }
        .mhr-sec.open .mhr-sec-body { display: block; }
        /* 分区内搜索 */
        .mhr-search { margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .mhr-search input {
            flex: 1; width: 100%; padding: 8px 14px; border: 1px solid var(--border-color);
            border-radius: 30px; font-size: 13px; font-family: inherit; background: #fff; color: var(--text-dark);
        }
        .mhr-search input:focus { outline: none; border-color: var(--pink-dark); box-shadow: 0 0 0 2px var(--pink-light); }
        .mhr-search-count { font-size: 11px; color: var(--text-mid); white-space: nowrap; }
        .mhr-noresult { display: none; font-size: 12px; color: var(--text-mid); padding: 10px 2px; }
        .mhr-typenote {
            font-size: 12px; line-height: 1.7; color: var(--text-mid);
            background: rgba(0,0,0,0.04); border-left: 3px solid var(--pink);
            border-radius: 6px; padding: 8px 12px; margin-bottom: 10px;
        }
        /* 星级标签 + 星级折叠 */
        .star {
            font-size: 11px; font-weight: bold; color: #fff; border-radius: 20px;
            padding: 1px 7px; white-space: nowrap; letter-spacing: -1px;
        }
        .s1 { background: #2ecc71; } .s2 { background: #3498db; } .s3 { background: #9b59b6; }
        .s4 { background: #e67e22; } .s5 { background: #e74c3c; } .s6 { background: #8e2b2b; } .s7 { background: #3b2a4a; }
        .mhr-star-group { border: 1px solid #e5d9de; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
        .mhr-star-group:last-child { margin-bottom: 0; }
        .mhr-star-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 12px; font-weight: bold; background: #fdf6f9; }
        .mhr-star-n { font-size: 11px; font-weight: normal; color: var(--text-mid); }
        .mhr-star-head .mhr-chev { margin-left: auto; }
        .mhr-star-body { display: none; padding: 10px 12px; }
        .mhr-star-group.open .mhr-star-body { display: block; }
        .mhr-star-group.open .mhr-chev { transform: rotate(180deg); }
        .mhr-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .mhr-item.mhr-ttag { margin-bottom: 0; }
        .mhr-ttag {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 12px; padding: 3px 10px; border-radius: 20px;
            background: #fdf6f9; border: 1px solid #eadde3; color: var(--text-dark);
            cursor: default;
        }
        .mhr-ttag em { font-style: normal; font-size: 11px; color: var(--text-light); }        .mhr-item { margin-bottom: 8px; }
        .mhr-item:last-child { margin-bottom: 0; }
        .mhr-item .mhr-task { margin-bottom: 0; }
        .mhr-tag {
            font-size: 11px; color: var(--pink-dark); background: #fff;
            border: 1px solid var(--pink-dark); border-radius: 20px;
            padding: 1px 7px; white-space: nowrap; font-weight: bold;
        }
        .mhr-unlock, .mhr-rtag {
            font-size: 11px; color: #4a5568; background: #eef1f6;
            border: 1px solid #d0d8e4; border-radius: 20px;
            padding: 1px 8px; white-space: nowrap;
        }
        .mhr-rtag { color: #5a6270; background: #f1f3f5; border-color: #d8dde3; }
        .mhr-req {
            font-size: 11px; color: #8a6d1f; background: #fff8e1;
            border: 1px solid #f0dca0; border-radius: 20px;
            padding: 1px 8px; white-space: nowrap;
        }
        .mhr-unlock-anim { color: #1c5d8f; background: #e8f2fb; border-color: #bcd8ef; }
        .mhr-unlock-title { color: #8a6a12; background: #fdf6dd; border-color: #ecdba0; }

    <script>
        // ---------- 音乐播放器 ----------
        const playlist = [
            { title: "Morning BGM", url: "music/morning.mp3" },
            { title: "Night BGM", url: "music/night.mp3" }
        ];
        let currentTrack = 0;
        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitleSpan = document.getElementById('songTitle');

        function loadTrack(index) {
            const track = playlist[index % playlist.length];
            audio.src = track.url;
            songTitleSpan.textContent = track.title;
            audio.load();
            if (!audio.paused) {
                audio.play().catch(()=>{});
                vinyl.classList.add('playing');
                playPauseBtn.textContent = '⏸️';
            } else {
                playPauseBtn.textContent = '▶️';
                vinyl.classList.remove('playing');
            }
        }
        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => { vinyl.classList.add('playing'); playPauseBtn.textContent = '⏸️'; }).catch(()=>{});
            } else {
                audio.pause();
                vinyl.classList.remove('playing');
                playPauseBtn.textContent = '▶️';
            }
        });
        prevBtn.addEventListener('click', () => { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; loadTrack(currentTrack); });
        nextBtn.addEventListener('click', () => { currentTrack = (currentTrack + 1) % playlist.length; loadTrack(currentTrack); });
        loadTrack(currentTrack);

        // ---------- 辅助函数 ----------
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        window.toggleGroup = function(header) {
            const options = header.nextElementSibling;
            const arrow = header.querySelector('.group-arrow');
            if (options.classList.contains('collapsed')) {
                options.classList.remove('collapsed');
                arrow.textContent = '▼';
            } else {
                options.classList.add('collapsed');
                arrow.textContent = '▶';
            }
        };

        // ---------- 分页组件（圆形按钮）----------
        function renderPaginationWithDots(containerId, currentPage, totalPages, onPageChange) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.classList.add('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            let pages = [];
            if (totalPages <= 7) {
                for (let i = 1; i <= totalPages; i++) pages.push(i);
            } else {
                pages.push(1);
                if (currentPage > 3) pages.push('...');
                let start = Math.max(2, currentPage - 1);
                let end = Math.min(totalPages - 1, currentPage + 1);
                if (currentPage <= 3) { start = 2; end = 4; }
                if (currentPage >= totalPages - 2) { start = totalPages - 3; end = totalPages - 1; }
                for (let i = start; i <= end; i++) pages.push(i);
                if (currentPage < totalPages - 2) pages.push('...');
                pages.push(totalPages);
            }
            let html = `<button class="prev-page" ${currentPage===1?'disabled':''}>‹ 上一页</button>`;
            for (let p of pages) {
                if (p === '...') {
                    html += `<span class="page-dots" data-dots="true">...</span>`;
                } else {
                    html += `<span class="page-number ${p===currentPage?'active':''}" data-page="${p}">${p}</span>`;
                }
            }
            html += `<button class="next-page" ${currentPage===totalPages?'disabled':''}>下一页 ›</button>`;
            container.innerHTML = html;

            container.querySelectorAll('.page-number').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = parseInt(btn.dataset.page);
                    if (!isNaN(page) && page !== currentPage) onPageChange(page);
                });
            });
            const prevBtn = container.querySelector('.prev-page');
            const nextBtn = container.querySelector('.next-page');
            if (prevBtn) prevBtn.addEventListener('click', () => { if (currentPage > 1) onPageChange(currentPage - 1); });
            if (nextBtn) nextBtn.addEventListener('click', () => { if (currentPage < totalPages) onPageChange(currentPage + 1); });
            container.querySelectorAll('.page-dots').forEach(dots => {
                dots.addEventListener('click', () => {
                    let input = prompt(`您要跳转到哪一页？（1-${totalPages}）`, currentPage);
                    if (input !== null) {
                        let page = parseInt(input);
                        if (!isNaN(page) && page >= 1 && page <= totalPages) onPageChange(page);
                        else alert(`请输入 1-${totalPages} 之间的数字`);
                    }
                });
            });
        }

        // ---------- 简单表格渲染（用于教程、精灵等）----------
        function renderSimpleTable(containerId, data, columns, pageSize = 10, options = {}) {
            let currentPage = 1;
            let filteredData = [...data];
            const searchKeys = (options && options.searchKeys && options.searchKeys.length) ? options.searchKeys : null;
            const searchPlaceholder = (options && options.placeholder) || '搜索...';

            function render() {
                const start = (currentPage - 1) * pageSize;
                const pageData = filteredData.slice(start, start + pageSize);
                const tbody = document.querySelector(`#${containerId} tbody`);
                if (!tbody) return;
                if (pageData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${columns.length}" class="empty-tip">没有匹配的内容</td></tr>`;
                } else {
                    tbody.innerHTML = pageData.map(row => {
                        let cells = '';
                        columns.forEach(col => {
                            let value = row[col.key] || '-';
                            if (col.type === 'video' && value && value !== '' && value !== '-') {
                                value = `<a href="${value}" target="_blank" style="color:#3B82F6;">🎬 视频</a>`;
                            } else if (col.type === 'url' && value && value !== '' && value !== '-' && value.indexOf('http') === 0) {
                                value = `<a href="${value}" target="_blank" style="color:#3B82F6;">🔗 详情</a>`;
                            } else if (col.type === 'sources') {
                                const pick = (row && row.sources) || [];
                                const official = pick.filter(s => s && s.label === 'official' && s.url).pop();
                                const alt = pick.filter(s => s && s.label !== 'official' && s.url).pop();
                                if (official || alt) {
                                    value = `<button type="button" class="sources-pick"`
                                        + (official ? ` data-o="${official.url}"` : '')
                                        + (alt ? ` data-a="${alt.url}"` : '')
                                        + (row.password ? ` data-p="${row.password}"` : '')
                                        + ` style="background:var(--pink-light);border:1px solid var(--border-color);border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer;">🔗 详情</button>`;
                                }
                            }
                            cells += `<td>${value}</td>`;
                        });
                        return `<tr>${cells}</tr>`;
                    }).join('');
                }
                const totalPages = Math.ceil(filteredData.length / pageSize);
                renderPaginationWithDots(`${containerId}-pagination`, currentPage, totalPages, (newPage) => {
                    currentPage = newPage;
                    render();
                });
            }

            function filterData(query) {
                if (!query) filteredData = [...data];
                else filteredData = data.filter(row => {
                    // 默认搜索所有字段；传了 searchKeys 则只搜这些字段
                    const q = query.toLowerCase();
                    const keys = searchKeys || (row ? Object.keys(row) : []);
                    return keys.some(k => {
                        const val = row ? row[k] : undefined;
                        if (val === null || val === undefined) return false;
                        const s = (typeof val === 'object') ? JSON.stringify(val) : val.toString();
                        return s.toLowerCase().includes(q);
                    });
                });
                currentPage = 1;
                render();
            }

            const container = document.getElementById(containerId);
            const searchHost = (container && container.parentElement) ? container.parentElement : container;
            if (searchHost && !searchHost.querySelector('.simple-search')) {
                const searchHtml = `<div class="simple-search" style="margin-bottom:12px;"><input type="text" placeholder="${searchPlaceholder}" id="${containerId}-search" style="width:100%; padding:6px 12px; border:1px solid var(--border-color); border-radius:30px;"></div>`;
                searchHost.insertAdjacentHTML('afterbegin', searchHtml);
                const searchBox = document.getElementById(`${containerId}-search`);
                if (searchBox) searchBox.addEventListener('input', (e) => filterData(e.target.value));
            }
            render();
        }

        // ---------- 完整模组统计组件（支持自定义列）----------
        class ModStatsView {
            constructor(containerId, modsData, options = {}) {
                this.containerId = containerId;
                this.allMods = modsData;
                this.filteredMods = [...modsData];
                this.currentPage = 1;
                this.pageSize = 15;
                this.searchQuery = '';
                this.statusFilter = '全部';
                this.filterCollapsed = false;
                // 自定义列配置（不传则使用僵毁默认列）
                this.customColumns = options.columns || null;
                this.simplified = options.simplified || false;
                // 僵毁专用筛选器
                if (!this.simplified) {
                    this.noteFilter = 'all';
                    this.chineseFilter = 'all';
                }
                this.videoFilter = 'all';
                this.loaderFilter = '全部';
                this.categoryFilter = '全部';
                this.init();
            }

            init() { this.render(); }

            getStatusClass(status) {
                const map = { '完整':'status-complete', '非完整':'status-incomplete', '待检测':'status-pending', '无需翻译':'status-unneeded', '待处理':'status-todo' };
                return map[status] || '';
            }

            getModLink(mod) {
                if (this.customColumns) return '#';
                if (mod.platform === 'steam' && mod.steamId) return `https://steamcommunity.com/sharedfiles/filedetails/?id=${mod.steamId}`;
                return '#';
            }

            getDefaultColumns() {
                return [
                    { key: 'name', label: '模组名称 / ID', type: 'modName' },
                    { key: 'chineseName', label: '模组中文名', type: 'text' },
                    { key: 'status', label: '翻译进度', type: 'status' },
                    { key: 'videoUrl', label: '视频教程', type: 'videoLink' },
                    { key: 'note', label: '备注', type: 'text' },
                    { key: 'category', label: '模组分类', type: 'text' },
                    { key: 'postUrl', label: '模组私帖', type: 'link', linkText: '📝 私帖' }
                ];
            }

            getColumns() { return this.customColumns || this.getDefaultColumns(); }

            updateStats() {
                const statsDiv = document.getElementById(`${this.containerId}-stats`);
                if (!statsDiv) return;
                const total = this.allMods.length;
                const countComplete = this.allMods.filter(m => m.status === '完整').length;
                const countIncomplete = this.allMods.filter(m => m.status === '非完整').length;
                const countPending = this.allMods.filter(m => m.status === '待检测').length;
                const countUnneeded = this.allMods.filter(m => m.status === '无需翻译').length;
                const countTodo = this.allMods.filter(m => m.status === '待处理').length;
                const countHasVideo = this.allMods.filter(m => m.videoUrl && m.videoUrl.trim() !== '' && m.videoUrl !== '视频待发布').length;
                statsDiv.innerHTML = `
                    <div class="stats-item"><span class="icon">📊</span> 总模组: <span class="stats-number">${total}</span></div>
                    <div class="stats-item stats-complete"><span class="icon">✅</span> 完整: <span class="stats-number">${countComplete}</span></div>
                    <div class="stats-item stats-todo"><span class="icon">⏳</span> 待处理: <span class="stats-number">${countTodo}</span></div>
                    <div class="stats-item stats-pending"><span class="icon">🔍</span> 待检测: <span class="stats-number">${countPending}</span></div>
                    <div class="stats-item stats-incomplete"><span class="icon">🟡</span> 非完整: <span class="stats-number">${countIncomplete}</span></div>
                    <div class="stats-item stats-unneeded"><span class="icon">🟣</span> 无需翻译: <span class="stats-number">${countUnneeded}</span></div>
                    <div class="stats-item"><span class="icon">📹</span> 已拥有视频: <span class="stats-number">${countHasVideo}</span></div>
                `;
            }

            applyFilters() {
                let filtered = [...this.allMods];
                if (this.searchQuery.trim()) {
                    const q = this.searchQuery.toLowerCase();
                    filtered = filtered.filter(mod => {
                        // 搜索所有字段（不仅是表格列）
                        const searchFields = [
                            mod.name, mod.chineseName, mod.note, mod.steamId,
                            mod.mcmodId, mod.videoUrl, mod.category, mod.postUrl,
                            mod.loaders, mod.platform, mod.mcmodUrl,
                            mod.modrinthUrl, mod.curseforgeUrl
                        ];
                        return searchFields.some(val => val && val.toString().toLowerCase().includes(q));
                    });
                }
                if (this.categoryFilter !== '全部') filtered = filtered.filter(mod => mod.category && mod.category.split('/').some(c => c.trim() === this.categoryFilter));
                if (!this.simplified) {
                    if (this.noteFilter !== 'all') filtered = filtered.filter(mod => this.noteFilter === 'yes' ? (mod.note && mod.note.trim()) : (!mod.note || !mod.note.trim()));
                    if (this.chineseFilter !== 'all') filtered = filtered.filter(mod => this.chineseFilter === 'yes' ? (mod.chineseName && mod.chineseName.trim()) : (!mod.chineseName || !mod.chineseName.trim()));
                }
                if (this.statusFilter !== '全部') filtered = filtered.filter(mod => mod.status === this.statusFilter);
                if (this.videoFilter !== 'all') filtered = filtered.filter(mod => this.videoFilter === 'yes' ? (mod.videoUrl && mod.videoUrl.trim() !== '' && mod.videoUrl !== '视频待发布') : (!mod.videoUrl || mod.videoUrl.trim() === '' || mod.videoUrl === '视频待发布'));
                if (this.loaderFilter !== '全部') filtered = filtered.filter(mod => mod.loaders && mod.loaders.includes(this.loaderFilter));
                this.filteredMods = filtered;
                this.currentPage = 1;
                this.renderTable();
                this.renderPagination();
            }

            renderTable() {
                const tbody = document.getElementById(`${this.containerId}-tbody`);
                if (!tbody) return;
                const columns = this.getColumns();
                const start = (this.currentPage - 1) * this.pageSize;
                const pageMods = this.filteredMods.slice(start, start + this.pageSize);
                if (pageMods.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${columns.length}" style="text-align:center; padding:40px;">没有匹配的模组</td></tr>`;
                    return;
                }
                let html = '';
                pageMods.forEach(mod => {
                    html += '<tr>';
                    columns.forEach(col => {
                        const val = mod[col.key];
                        html += '<td>';
                        switch (col.type) {
                            case 'modName':
                                const mLink = this.getModLink(mod);
                                let idDisp = '';
                                if (mod.steamId) idDisp = `<span class="mod-id">${mod.steamId}</span>`;
                                else if (mod.id) idDisp = `<span class="mod-id">${mod.id}</span>`;
                                html += `<a href="${mLink}" target="_blank">${escapeHtml(mod.name)}</a>${idDisp}`;
                                break;
                            case 'status':
                                html += `<span class="status-badge ${this.getStatusClass(val)}">${escapeHtml(val || '-')}</span>`;
                                break;
                            case 'videoLink':
                            case 'link':
                                if (val && val.trim()) {
                                    html += `<a href="${val}" target="_blank" style="color:#3B82F6;">${col.linkText || '🔗 链接'}</a>`;
                                } else { html += '-'; }
                                break;
                            default:
                                html += escapeHtml(val || '-');
                        }
                        html += '</td>';
                    });
                    html += '</tr>';
                });
                tbody.innerHTML = html;

                    const hintHtml = `<div style="font-size:12px;color:var(--text-mid);margin-bottom:10px;">💡 打斗演示视频见上方「⭐ JOJO群星之战攻略」</div>`;

                    html += `<details class="section-details"><summary>🎁 报酬获取预览 (${jojoRewardItems.length}个)</summary><div class="section-content">${noteHtml}${dioHint}${hintHtml}<div id="jojoRewardsTableContainer"><table class="mod-table" id="jojoRewardsTable"><thead><tr><th>获取方式</th><th>可获报酬</th></tr></thead><tbody></tbody></table><div id="jojoRewardsTable-pagination"></div></div></div></details>`;

                detailDiv.innerHTML = html || '<div class="empty-tip">暂无内容</div>';

                if (jojoGuides.length) {

                }
                if (other.length) {

                if (jojoRewardItems.length) {
